async function fetchJson(url,fallback){
  try{ const r=await fetch(url); if(!r.ok)throw new Error(); return await r.json(); }catch{ return fallback; }
}
async function loadData(){
  const [eventi,gdl,libri,oggi,homepage,impostazioni,shop,imgOverride,testiOverride,terrOverride]=await Promise.all([
    fetchJson(DATA_URLS.eventi,SAMPLE.eventi),

    fetchJson(DATA_URLS.oggi,SAMPLE.oggi),
    fetchJson(DATA_URLS.homepage,SAMPLE.homepage),
    fetchJson(DATA_URLS.impostazioni,SAMPLE.impostazioni),
    fetchJson(DATA_URLS.shop,SAMPLE_SHOP),
    fetchJson(DATA_URLS.immagini,null),
    fetchJson(DATA_URLS.testi,null),
    fetchJson(DATA_URLS.scaffali,null)
  ]);
  state.eventi=eventi; state.gdl=gdl; state.libri=libri; state.oggi=oggi; state.homepage=homepage; state.impostazioni=impostazioni; state.shop=shop;
  if(imgOverride) SITE_IMG=Object.assign({},SITE_IMG,imgOverride);

    state.selLibro=s.libroId?state.libri.find(l=>l.id==s.libroId):null;

function runFades(){
  document.querySelectorAll(".fade:not(.in)").forEach(el=>{
    const obs=new IntersectionObserver(([e])=>{ if(e.isIntersecting){ el.classList.add("in"); obs.disconnect(); } },{threshold:.1});
    obs.observe(el);
  });
}
function render(){
  renderShell();
  const c=document.getElementById("content");
  if(state.section==="home") c.innerHTML=renderHome();
  else if(state.section==="scaffali") c.innerHTML=renderScaffali();
  else if(state.section==="eventi") c.innerHTML=renderEventi();
  else if(state.section==="gdl") c.innerHTML=renderGdl();
  else if(state.section==="wishlist") c.innerHTML=renderWishlist();
  else if(state.section==="tavolo") c.innerHTML=renderTavolo();
  else if(state.section==="dove") c.innerHTML=renderDove();
  else if(state.section==="shop") c.innerHTML=renderShop();
  else if(state.section==="privacy") c.innerHTML=renderPrivacy();
  else if(state.section==="cookie") c.innerHTML=renderCookie();
  else c.innerHTML=renderHome();
  runFades();
}

function shareResult(territorio){
  const testo=`Il mio territorio emotivo ai Funamboli è "${territorio}". Scopri il tuo su ifunamboli.it`;
  if(navigator.share){ navigator.share({title:"I Funamboli",text:testo}).catch(()=>{}); }
  else{ navigator.clipboard?.writeText(testo).then(()=>alert("Testo copiato! Incollalo dove vuoi condividerlo.")).catch(()=>alert(testo)); }
}
function quizStart(){ state.quizStep=0; state.quizAns=[]; state.quizRes=null; render(); }
function quizAnswer(i){
  state.quizAns.push(i);
  if(state.quizStep<QUIZ.length-1){ state.quizStep++; }
  else{ const counts={}; state.quizAns.forEach((r,qi)=>{ const t=QUIZ_MAP[qi][r]; counts[t]=(counts[t]||0)+1; }); state.quizRes=Object.entries(counts).sort((a,b)=>b[1]-a[1])[0][0]; }
  render();
}
function quizReset(){ state.quizStep=-1; state.quizAns=[]; state.quizRes=null; render(); }

      <p class="serif" style="font-size:22px;margin-bottom:.75rem;">${esc(g.nome)}</p>
      ${g.libro?`<p style="font-size:15px;font-style:italic;margin-bottom:4px;">📖 ${esc(g.libro)}${g.autore?' — '+esc(g.autore):''}</p>`:""}
      ${g.data?`<p style="font-size:13px;color:var(--gold);margin-bottom:4px;">Prossimo incontro: ${fmtDate(g.data)}${g.ora?' alle '+esc(g.ora):''}</p>`:""}
      ${g.posti!==undefined&&g.posti!==""?`<p style="margin-top:4px;">${urgente?`<span class="urgency">Ultimi posti — solo ${g.posti}!</span>`:posti===0?`<span style="font-size:13px;color:#8A2020;">Posti esauriti</span>`:`<span style="font-size:13px;color:#2A5A20;">${g.posti} posti disponibili</span>`}</p>`:""}
      ${g.descrizione?`<p style="font-size:14px;color:var(--muted);margin-top:8px;line-height:1.75;">${esc(g.descrizione)}</p>`:""}
      <button onclick="openWA('Ciao! Vorrei iscrivermi al gruppo &quot;${jsAttr(g.nome)}&quot;.')" style="margin-top:12px;background:var(--dark);color:#fff;border:none;border-radius:100px;padding:.6rem 1.4rem;font-size:12px;">Iscriviti via WhatsApp</button>
    </div>`;}).join("")}
    <button class="btn-ghost fade in" onclick="openWA('Ciao! Vorrei informazioni sui gruppi di lettura de I Funamboli.')" style="display:flex;align-items:center;justify-content:center;gap:8px;">${WA_ICON} Scrivici per info sui gruppi</button>
  </div>`;
}

/* ============ WISHLIST ============ */
function renderWishlist(){
  return `<div class="section-pad narrow" style="padding-bottom:2.5rem;"><p class="eyebrow fade in">${esc(TESTI.wishlistEyebrow)}</p><p class="serif fade in" style="font-size:28px;line-height:1.4;margin-bottom:.75rem;">${esc(TESTI.wishlistTitolo)}</p><p class="fade in" style="font-size:14px;color:var(--muted);line-height:1.8;">${esc(TESTI.wishlistTesto)}</p></div>
  <div class="fade narrow" style="padding:0 1.5rem 3rem;"><button class="btn-dark" onclick="openWA('Ciao! Vorrei essere avvisato/a quando arriva questo libro: ')">${WA_ICON} Scrivici il titolo su WhatsApp</button></div>`;
}

/* ============ SHOP ============ */
function renderShop(){
  if(!SHOP_ATTIVO) return `<div class="section-pad narrow"><p style="color:var(--muted);">Sezione non disponibile.</p></div>`;
  if(state.selProdotto){
    const p=state.selProdotto;
    return `<div class="photo-box" style="position:relative;height:340px;background:var(--bg-warm);">
      <div class="fallback" style="background:linear-gradient(135deg,#DCEEEE,#8A6A40);"></div>
      <img src="${imgSrc(p.immagine)||''}" alt="${esc(p.nome)}" onerror="this.style.opacity='0'">
      <button onclick="backToShop()" class="back-pill" style="top:5.5rem;left:1.5rem;">← Negozio</button>
    </div>
    <div class="fade in narrow" style="padding:2rem 1.5rem;">
      ${p.categoria?`<span class="tag-pill" style="background:var(--bg-warm);color:var(--gold);margin-bottom:1rem;">${esc(p.categoria)}</span>`:""}
      <h1 class="serif" style="font-size:26px;line-height:1.3;margin-bottom:.5rem;">${esc(p.nome)}</h1>
      ${p.prezzo?`<p style="font-size:20px;color:var(--gold);font-weight:500;margin-bottom:1.5rem;">${esc(p.prezzo)}</p>`:""}
      ${p.descrizione?`<p style="font-size:15px;line-height:1.9;margin-bottom:2.5rem;">${esc(p.descrizione)}</p>`:""}
      <button class="btn-dark" onclick="openWA('Ciao! Vorrei acquistare &quot;${jsAttr(p.nome)}&quot;${p.prezzo?` (${jsAttr(p.prezzo)})`:""}. Potete mandarmi il link per il pagamento?')">${WA_ICON} Acquista su WhatsApp</button>
    </div>`;
  }
  const cats=[...new Set(state.shop.map(p=>p.categoria).filter(Boolean))];
  const filtro=state.shopCat||null;
  const items=filtro?state.shop.filter(p=>p.categoria===filtro):state.shop;
  return `<div class="section-pad narrow" style="padding-bottom:1.5rem;max-width:1080px;">
    <p class="eyebrow fade in">${esc(TESTI.shopEyebrow)}</p>
    <p class="serif fade in" style="font-size:30px;line-height:1.4;">${esc(TESTI.shopTitolo)}</p>
    <p class="fade in" style="font-size:14px;color:var(--muted);margin-top:.5rem;margin-bottom:1.5rem;">${esc(TESTI.shopSottotitolo)}</p>
    ${cats.length>1?`<div class="fade in">
      <span class="cat-chip ${!filtro?'active':''}" onclick="selectShopCat(null)">Tutti</span>
      ${cats.map(c=>`<span class="cat-chip ${filtro===c?'active':''}" onclick="selectShopCat('${esc(c).replace(/'/g,"\\'")}')">${esc(c)}</span>`).join("")}
    </div>`:""}
  </div>
  <div class="narrow grid-shop" style="padding:0 1.5rem 3rem;max-width:1080px;">
    ${items.length===0?`<p style="color:var(--muted);font-size:14px;">Nessun prodotto disponibile al momento.</p>`:
    items.map(p=>`<div class="shop-card fade in" style="cursor:pointer;" onclick="selectProdotto(${p.id})">
      <div class="shop-img">
        ${p.categoria?`<span class="shop-cat">${esc(p.categoria)}</span>`:""}
        <img src="${imgSrc(p.immagine)||''}" alt="${esc(p.nome)}" loading="lazy" onerror="this.style.opacity='0'" style="background:linear-gradient(135deg,#DCEEEE,#8A6A40);">
      </div>
      <div class="shop-body">
        <p class="shop-nome">${esc(p.nome)}</p>
        ${p.prezzo?`<p class="shop-prezzo">${esc(p.prezzo)}</p>`:""}
        ${p.descrizione?`<p class="shop-desc">${esc(p.descrizione)}</p>`:""}
        <button class="shop-btn" onclick="event.stopPropagation(); openWA('Ciao! Vorrei acquistare &quot;${jsAttr(p.nome)}&quot;${p.prezzo?` (${jsAttr(p.prezzo)})`:""}. Potete mandarmi il link per il pagamento?')">${WA_ICON} Acquista</button>
      </div>
    </div>`).join("")}
  </div>`;
}
function selectShopCat(cat){ state.shopCat=cat; render(); }

/* ============ TAVOLO ============ */
function renderTavolo(){
  if(!PRENOTAZIONI_ATTIVE){
    return `<div class="section-pad narrow" style="padding-bottom:2.5rem;">
      <p class="eyebrow fade in">${esc(TESTI.salaTeEyebrow)}</p>
      <p class="serif fade in" style="font-size:28px;line-height:1.4;margin-bottom:1rem;">${esc(TESTI.salaTeTitle)}</p>
      <p class="fade in" style="font-size:14px;color:var(--muted);line-height:1.8;margin-bottom:2rem;">${esc(PRENOTAZIONI_MSG)}</p>
      <button class="btn-dark fade in" onclick="openWA('Ciao! Vorrei venire a trovarvi.')">${WA_ICON} Scrivici su WhatsApp</button>
    </div>`;
  }
  const orari=["9.30","10.00","10.30","11.00","11.30","12.00","12.30","13.00","17.00","17.30","18.00","18.30","19.00","19.30","20.00","20.30","21.00"];
  return `<div class="fade in photo-box" style="position:relative;height:260px;"><div class="fallback" style="background:linear-gradient(135deg,#4A3A20,var(--dark));"></div><img src="${siteImg('tavolo')}" alt="Sala da tè" loading="lazy" decoding="async" onerror="this.style.display='none'"><div style="position:absolute;inset:0;background:linear-gradient(to bottom,rgba(26,22,16,.2),rgba(26,22,16,.8));z-index:1;"></div><div class="narrow" style="position:absolute;bottom:0;left:0;right:0;padding:2rem 1.5rem;z-index:2;"><p class="eyebrow" style="color:var(--gold-light)">${esc(TESTI.salaTeEyebrow)}</p><p class="serif" style="font-size:28px;color:#fff;line-height:1.3;">${esc(TESTI.salaTeTitle)}</p></div></div>
  <div class="fade narrow" style="padding:2.5rem 1.5rem;">
    <p style="font-size:14px;color:var(--muted);line-height:1.85;margin-bottom:2.5rem;">${esc(TESTI.tavoloIntro)}</p>
    <input id="tv-nome" placeholder="Nome e cognome *" aria-label="Nome e cognome">
    <input id="tv-data" type="date" min="${new Date().toISOString().slice(0,10)}" aria-label="Data" onchange="checkTavoloData(this)">
    <select id="tv-ora" aria-label="Ora"><option value="">Ora *</option>${orari.map(o=>`<option>${o}</option>`).join("")}</select>
    <select id="tv-persone" aria-label="Numero di persone">${["1","2","3","4","5","6"].map(n=>`<option>${n} ${n==="1"?"persona":"persone"}</option>`).join("")}</select>
    <textarea id="tv-note" placeholder="Note (allergie, occasioni speciali…)" aria-label="Note"></textarea>
    <button class="btn-dark" onclick="inviaTavolo()" style="margin-top:1.5rem;">${WA_ICON} Invia richiesta su WhatsApp</button>
    <p style="font-size:11.5px;color:var(--muted);text-align:center;margin-top:1rem;">Risposta entro poche ore.</p>
  </div>`;
}
function isMercoledi(dataStr){
  if(!dataStr) return false;
  const d=new Date(dataStr+"T00:00:00");
  return d.getDay()===3;
}
function checkTavoloData(input){
  if(isMercoledi(input.value)){
    alert("Il mercoledì siamo chiusi — scegli un altro giorno.");
    input.value="";
  }
}
function inviaTavolo(){
  const nome=document.getElementById("tv-nome").value.trim(), data=document.getElementById("tv-data").value, ora=document.getElementById("tv-ora").value, persone=document.getElementById("tv-persone").value, note=document.getElementById("tv-note").value.trim();
  if(!nome||!data||!ora){ alert("Compila almeno nome, data e ora."); return; }
  if(isMercoledi(data)){ alert("Il mercoledì siamo chiusi — scegli un altro giorno."); return; }
  openWA(`Ciao! Vorrei prenotare un tavolo.\n\nNome: ${nome}\nData: ${fmtDate(data)}\nOra: ${ora}\nPersone: ${persone}${note?`\nNote: ${note}`:""}`);
}

/* ============ DOVE ============ */

  <div class="fade narrow" style="padding:2.5rem 1.5rem;">

    <p class="eyebrow">Orari</p>

    <div style="margin-top:2.5rem;">
      <a href="tel:+${PHONE}" class="info-link"><div><p style="font-size:14px;">${PHONE.replace(/^39/,'0')}</p><p>Tel / WhatsApp</p></div><span class="chev">›</span></a>
      <a href="mailto:${EMAIL}" class="info-link"><div><p style="font-size:14px;">${EMAIL}</p><p>Email</p></div><span class="chev">›</span></a>
      <a href="https://instagram.com/${IG}" target="_blank" rel="noopener noreferrer" class="info-link"><div><p style="font-size:14px;">@${IG}</p><p>Instagram</p></div><span class="chev">›</span></a>
    </div>
  </div>`;
}

    return `<div class="section-pad narrow" style="padding-bottom:2rem;"><button onclick="navigate('home')" class="back-link" class="legal-p">← Torna alla home</button><p class="eyebrow">Cookie policy</p><p class="serif" style="font-size:26px;line-height:1.4;">Informativa sui cookie</p></div>

loadData().then(function(){
